name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm run lint
      - run: pnpm run check
      - run: pnpm run test:unit -- --run

      # Builds every downloadable format: also the gate that fails the PR when
      # content/cv.*.md is malformed, rather than letting it reach a deploy.
      - run: pnpm run export

      - run: pnpm run test:e2e

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resume-exports
          path: static/exports/
